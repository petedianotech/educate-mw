name: Patch App Voice UI
on:
  push:
    paths:
      - "scripts/patch_app_voice_ui.py"
      - ".github/workflows/patch-app-voice.yml"
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_app_voice_ui.py
      - run: |
          git config user.name "Peter Damiano"
          git config user.email "petedianotech@gmail.com"
          git add src/App.tsx
          git commit -m "UI: voice switch restart feedback + You said subtitle" || echo none
          git push origin HEAD:main
