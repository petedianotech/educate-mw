name: Fix icons + Pro blue
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-icons-pro.yml"
      - "scripts/fix_icons_pro.py"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply icon + Pro blue fixes
        run: |
          python3 scripts/fix_icons_pro.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/CertificatesCleanView.tsx scripts/fix_icons_pro.py
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "fix: use public/app-icon.png everywhere + Pro subscription blue theme"
            git push origin HEAD:main
          fi
