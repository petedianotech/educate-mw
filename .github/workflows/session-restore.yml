name: Session Restore Patch
on:
  push:
    paths:
      - "scripts/session_restore_patch.py"
      - ".github/workflows/session-restore.yml"
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/session_restore_patch.py
      - run: |
          git config user.name "Peter Damiano"
          git config user.email "petedianotech@gmail.com"
          git add src/App.tsx
          git commit -m "feat: restore last screen on app return; auth stays signed in" || echo none
          git push origin HEAD:main
