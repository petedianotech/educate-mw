name: Fix App sentence-case + delete non-APK workflows
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-app-and-clean.yml"

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore App.tsx from good commit + sentence-case
        run: |
          curl -fsSL "https://raw.githubusercontent.com/petedianotech/educate-mw/02f056c/src/App.tsx" -o src/App.tsx
          python3 << 'PY'
          import re
          from pathlib import Path
          p = Path("src/App.tsx")
          text = p.read_text()
          def strip_upper(m):
              prefix, cls, suffix = m.group(1), m.group(2), m.group(3)
              if re.search(r'text-(?:lg|xl|2xl)', cls):
                  cls = re.sub(r'\s*uppercase\s*', ' ', cls)
                  cls = re.sub(r' {2,}', ' ', cls).strip()
              return f'{prefix}{cls}{suffix}'
          text = re.sub(r'(className=\{`)([^`]*)(`\})', strip_upper, text)
          text = re.sub(r'(className=")([^"]*)(")', strip_upper, text)
          p.write_text(text)
          print("App.tsx restored + sentence-case applied")
          PY
      - name: Delete all non-APK workflows
        run: |
          cd .github/workflows
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in
              android-apk.yml) echo "KEEP $f" ;;
              *) echo "DELETE $f"; rm -f "$f" ;;
            esac
          done
          ls -la
          test $(ls -1 *.yml 2>/dev/null | wc -l) -eq 1
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "chore: restore App.tsx sentence-case titles + only android-apk workflow remains

- Restored App.tsx from 02f056c (Pro blue + icons)
- Removed uppercase from main page headers (professional sentence-case)
- Deleted all non-APK workflows permanently" || true
          git push origin HEAD:main
