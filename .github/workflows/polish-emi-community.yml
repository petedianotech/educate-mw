name: Polish Emi Chat + Community UI
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/polish-emi-community.yml"
jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply Emi + Community visual polish
        run: |
          python3 << 'PY'
          from pathlib import Path

          app = Path("src/App.tsx")
          text = app.read_text()
          n = 0

          def rep(old, new, label):
              global text, n
              if old in text:
                  text = text.replace(old, new, 1)
                  n += 1
                  print("OK", label)
              else:
                  print("MISS", label)

          rep(
              """                <span className=\"text-gray-400 text-[10px] font-bold tracking-wide uppercase font-sans\">
                  Always active
                </span>""",
              """                <span className=\"text-emerald-500/90 text-[10px] font-bold tracking-wide uppercase font-sans\">
                  Online · Ready to help
                </span>""",
              "emi-status",
          )

          rep(
              """            className={`flex flex-col ${theme === \"dark\" ? \"bg-gray-900 border-gray-800 shadow-[0_10px_40px_rgba(0,0,0,0.3)]\" : \"bg-white border-slate-200 shadow-xl shadow-slate-200/60\"} rounded-3xl p-1.5 pl-4 border transition-all duration-300 focus-within:ring-2 focus-within:ring-indigo-500/20`}
          >
            <div className=\"flex items-end gap-2 w-full\">
              <textarea
                placeholder=\"Ask anything...\"
                className={`flex-1 bg-transparent text-[15px] outline-none ${theme === \"dark\" ? \"text-white placeholder-gray-500\" : \"text-slate-900 placeholder-slate-400\"} font-medium py-3.5 resize-none max-h-36 min-h-[40px] leading-relaxed overflow-y-auto scrollbar-thin`}""",
              """            className={`flex flex-col ${theme === \"dark\" ? \"bg-gray-900/95 border-gray-700/80 shadow-[0_12px_40px_rgba(0,0,0,0.35)]\" : \"bg-white border-slate-200 shadow-xl shadow-indigo-500/5\"} rounded-[22px] p-2 pl-4 border transition-all duration-300 focus-within:border-indigo-500/50 focus-within:ring-4 focus-within:ring-indigo-500/15`}
          >
            <div className=\"flex items-end gap-2.5 w-full\">
              <textarea
                placeholder=\"Ask Emi about notes, formulas, past papers...\"
                rows={1}
                className={`flex-1 bg-transparent text-[15px] outline-none ${theme === \"dark\" ? \"text-white placeholder-gray-500\" : \"text-slate-900 placeholder-slate-400\"} font-medium py-3.5 resize-none max-h-40 min-h-[48px] leading-relaxed overflow-y-auto`}""",
              "emi-input-shell",
          )

          rep(
              """                I can help you understand concepts, solve problems, or just
                chat.""",
              """                Ask about Form 1–4 topics, past papers, or exam tips —
                text or live voice.""",
              "emi-empty-copy",
          )

          rep(
              """          <span className=\"text-[10px] font-black tracking-[0.25em] text-indigo-500 uppercase\">
            Emi Calling Studio
          </span>""",
              """          <span className=\"text-[10px] font-black tracking-[0.2em] text-indigo-500 uppercase\">
            Live Voice Tutor
          </span>""",
              "call-title",
          )

          rep(
              """            {isConnected ? \"Live Active\" : \"Connecting\"}""",
              """            {isConnected ? \"Connected\" : \"Connecting…\"}""",
              "call-status",
          )

          rep(
              """              <span className=\"text-xs font-bold\">Emi is formulating your answer...</span>""",
              """              <span className=\"text-xs font-bold\">Emi is thinking…</span>""",
              "call-thinking",
          )

          rep(
              """              className={`p-5 md:p-6 shadow-sm relative ${theme === \"dark\" ? \"bg-gray-950 border-y border-gray-900 text-gray-200\" : \"bg-white border-y border-slate-200 text-slate-800\"} -mx-5 md:mx-0 md:rounded-3xl md:border font-medium`}""",
              """              className={`p-4 md:p-5 shadow-sm relative ${theme === \"dark\" ? \"bg-gray-900/80 border border-gray-800/80 text-gray-200\" : \"bg-white border border-slate-200/90 text-slate-800\"} rounded-2xl md:rounded-3xl font-medium`}""",
              "emi-bubble",
          )

          rep(
              """      className={`absolute inset-0 z-50 flex flex-col ${theme === \"dark\" ? \"bg-gray-950 text-white\" : \"bg-slate-50 text-slate-900\"} animate-in slide-in-from-right duration-300`}
    >
      {/* Header */}
      <div
        className={`${theme === \"dark\" ? \"bg-gray-950/80 border-gray-800\" : \"bg-white/80 border-slate-200 shadow-sm\"} backdrop-blur-xl border-b pt-4 pb-2 px-5 flex justify-between items-center shrink-0 z-20 sticky top-0`}
      >""",
              """      className={`absolute inset-0 z-50 flex flex-col ${theme === \"dark\" ? \"emw-page-bg-dark text-white\" : \"emw-page-bg text-slate-900\"} animate-in slide-in-from-right duration-300`}
    >
      {/* Header */}
      <div
        className={`${theme === \"dark\" ? \"bg-gray-950/90 border-gray-800/80\" : \"bg-white/90 border-slate-200/80 shadow-sm\"} backdrop-blur-xl border-b pt-3 pb-2.5 px-4 sm:px-5 flex justify-between items-center shrink-0 z-20 sticky top-0`}
      >""",
              "emi-page-header",
          )

          app.write_text(text)
          print("App.tsx patches:", n)

          cv = Path("src/components/CommunityView.tsx")
          ctext = cv.read_text()
          cn = 0

          def crep(old, new, label):
              global ctext, cn
              if old in ctext:
                  ctext = ctext.replace(old, new, 1)
                  cn += 1
                  print("OK-C", label)
              else:
                  print("MISS-C", label)

          crep(
              """    <div className={`absolute inset-0 z-50 flex flex-col ${theme === 'dark' ? 'bg-gray-950 text-white' : 'bg-slate-50 text-slate-900'} animate-in slide-in-from-right duration-300`}>""",
              """    <div className={`absolute inset-0 z-50 flex flex-col ${theme === 'dark' ? 'emw-page-bg-dark text-white' : 'emw-page-bg text-slate-900'} animate-in slide-in-from-right duration-300`}>""",
              "community-bg",
          )

          crep(
              """                placeholder=\"Share an academic question, study tip, or discuss an MSCE concept with everyone...\"
                rows={2}
                className={`w-full bg-transparent outline-none text-xs font-medium resize-none ${theme === 'dark' ? 'text-gray-100' : 'text-slate-900'} placeholder-gray-500`}""",
              """                placeholder=\"Share a question, study tip, or MSCE concept…\"
                rows={3}
                className={`w-full bg-transparent outline-none text-sm font-medium resize-none min-h-[72px] leading-relaxed ${theme === 'dark' ? 'text-gray-100' : 'text-slate-900'} placeholder-gray-500`}""",
              "composer-textarea",
          )

          crep(
              """        <div className=\"fixed inset-0 z-[90] bg-black/70 backdrop-blur-xs flex items-center justify-center p-4 animate-in fade-in\">""",
              """        <div className=\"fixed inset-0 z-[90] emw-overlay flex items-center justify-center p-4 animate-in fade-in\">""",
              "hide-modal-overlay",
          )

          crep(
              """        <div className=\"fixed top-16 left-1/2 -translate-x-1/2 z-[100] bg-indigo-600 text-white text-xs font-black px-4 py-2 rounded-full shadow-2xl animate-in fade-in slide-in-from-top-2 flex items-center gap-2 border border-indigo-400/30\">""",
              """        <div className=\"fixed top-16 left-1/2 -translate-x-1/2 z-[100] bg-indigo-600 text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-lg shadow-indigo-600/25 animate-in fade-in slide-in-from-top-2 flex items-center gap-2 border border-indigo-400/20\">""",
              "toast",
          )

          crep(
              """      <div className={`${theme === 'dark' ? 'bg-gray-900/90 border-gray-800' : 'bg-white/90 border-slate-200 shadow-sm'} backdrop-blur-xl pt-4 pb-3 px-4 sm:px-6 flex items-center justify-between shrink-0 z-10 border-b shadow-md`}>""",
              """      <div className={`${theme === 'dark' ? 'bg-gray-950/90 border-gray-800/80' : 'bg-white/95 border-slate-200/80'} backdrop-blur-xl pt-3 pb-2.5 px-4 sm:px-5 flex items-center justify-between shrink-0 z-10 border-b`}>""",
              "community-header",
          )

          crep(
              """            <h3 className={`font-black ${theme === 'dark' ? 'text-white' : 'text-slate-900'} text-xs uppercase tracking-wider text-gray-400`}>
              Active Study groups
            </h3>""",
              """            <h3 className=\"font-bold text-[11px] uppercase tracking-wider text-gray-500\">
              Study groups
            </h3>""",
              "groups-label",
          )

          crep(
              """                  className={`shrink-0 min-w-[150px] sm:min-w-[170px] ${
                    theme === 'dark' ? 'bg-gray-900/90 border-gray-800 hover:border-indigo-500/50' : 'bg-white border-slate-200 hover:border-indigo-400'
                  } rounded-2xl p-3 border flex items-center justify-between cursor-pointer transition-all active:scale-95 group ${
                    isHidden ? 'opacity-50' : ''
                  }`}""",
              """                  className={`shrink-0 min-w-[148px] sm:min-w-[164px] ${
                    theme === 'dark' ? 'bg-gray-900/80 border-gray-800 hover:border-indigo-500/40' : 'bg-white border-slate-200/90 hover:border-indigo-300'
                  } rounded-2xl p-2.5 border flex items-center justify-between cursor-pointer transition-all active:scale-95 group shadow-sm ${
                    isHidden ? 'opacity-45' : ''
                  }`}""",
              "group-cards",
          )

          cv.write_text(ctext)
          print("CommunityView patches:", cn)

          css = Path("src/index.css")
          css_text = css.read_text()
          extra = """

/* ---------- Emi + Community polish helpers ---------- */
.emw-composer {
  border-radius: 1.25rem;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.emw-composer:focus-within {
  border-color: rgba(99, 102, 241, 0.45);
  box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
}
.emw-chip {
  border-radius: 9999px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.02em;
  padding: 0.4rem 0.85rem;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.emw-chip-active {
  background: linear-gradient(180deg, #6366f1 0%, #4f46e5 100%);
  color: white;
  border-color: transparent;
  box-shadow: 0 4px 12px -3px rgba(79, 70, 229, 0.4);
}
"""
          if "emw-composer" not in css_text:
              css.write_text(css_text + extra)
              print("CSS helpers added")
          else:
              print("CSS helpers already present")
          PY
          git config user.name "Peter Damiano"
          git config user.email "petedianotech@gmail.com"
          git add src/App.tsx src/components/CommunityView.tsx src/index.css
          git status
          git commit -m "UI: polish Emi chat input/header/bubbles, live call labels, community composer & layout" || echo "no changes"
          git push origin HEAD:main
