name: Polish login OG public
on:
  push:
    paths:
      - "scripts/polish_login_splash.py"
      - "scripts/generate_og_and_clean_public.sh"
      - ".github/workflows/polish-login-og-public.yml"
      - "index.html"
      - "capacitor.config.ts"
  workflow_dispatch:
jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/polish_login_splash.py
      - run: bash scripts/generate_og_and_clean_public.sh
      - run: |
          git config user.name "Peter Damiano"
          git config user.email "petedianotech@gmail.com"
          git add src/App.tsx public/ index.html capacitor.config.ts || true
          git add -u public/ || true
          git commit -m "ui: native login simplified, og-image from app-icon, public cleanup" || echo none
          git push origin HEAD:main
