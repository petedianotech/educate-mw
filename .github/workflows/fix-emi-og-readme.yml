name: Fix Emi client + OG image
on:
  push:
    paths:
      - "scripts/fix_emi_json.py"
      - "scripts/generate_og_image.sh"
      - ".github/workflows/fix-emi-og-readme.yml"
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_emi_json.py
      - run: bash scripts/generate_og_image.sh || true
      - run: |
          git config user.name "Peter Damiano"
          git config user.email "petedianotech@gmail.com"
          git add src/App.tsx public/og-image.png || true
          git commit -m "fix: safe Emi JSON parse + app-icon-based OG image" || echo none
          git push origin HEAD:main
