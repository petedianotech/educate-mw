name: Fix build blockers
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-build.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch geminiLive + App.tsx
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          import re

          # 1) geminiLive — remove duplicate transcription keys after speechConfig
          p = Path("src/services/geminiLive.ts")
          t = p.read_text()
          old = '''              speechConfig: {
                languageCode: "en-US",
                voiceConfig: {
                  prebuiltVoiceConfig: {
                    voiceName: targetVoice,
                  },
                },
              },
              inputAudioTranscription: {},
              outputAudioTranscription: {},
              systemInstruction: systemInstructionText,'''
          new = '''              speechConfig: {
                languageCode: "en-US",
                voiceConfig: {
                  prebuiltVoiceConfig: {
                    voiceName: targetVoice,
                  },
                },
              },
              systemInstruction: systemInstructionText,'''
          if old in t:
              t = t.replace(old, new, 1)
              p.write_text(t)
              print("geminiLive: removed duplicate keys")
          else:
              print("geminiLive: already clean or pattern missing", t.count("inputAudioTranscription: {}"))

          # 2) App.tsx — remove static rows={1} when dynamic rows follows
          p = Path("src/App.tsx")
          t = p.read_text()
          t2 = t.replace(
              "rows={1}\n                className={`flex-1 bg-transparent text-[15px]",
              "className={`flex-1 bg-transparent text-[15px]",
              1,
          )
          if t2 != t:
              p.write_text(t2)
              print("App.tsx: removed duplicate rows={1}")
          else:
              print("App.tsx: rows already ok or pattern missing")
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/services/geminiLive.ts src/App.tsx
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "fix: remove Live duplicate keys + App rows (Vite build)"
            git push origin HEAD:main
          fi
