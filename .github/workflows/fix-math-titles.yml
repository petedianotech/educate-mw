name: Fix math KaTeX + titles + restore Dictionary
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-math-titles.yml"

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Restore DictionaryView if placeholder
        run: |
          F=src/components/DictionaryView.tsx
          SIZE=$(wc -c < "$F" 2>/dev/null || echo 0)
          if [ "$SIZE" -lt 1000 ] || grep -q PLACEHOLDER "$F" 2>/dev/null; then
            curl -fsSL "https://raw.githubusercontent.com/petedianotech/educate-mw/44deb0f2924cedb5d1ed86675f5d76649b6d68ee/src/components/DictionaryView.tsx" -o "$F"
            echo "Restored DictionaryView from good commit"
          fi
          test -s "$F"

      - name: Sentence-case main page titles
        run: |
          python3 << 'PY'
          import re
          from pathlib import Path

          def strip_upper(text):
              def fix(m):
                  prefix, cls, suffix = m.group(1), m.group(2), m.group(3)
                  if re.search(r'text-(?:lg|xl|2xl)', cls) and 'uppercase' in cls:
                      cls = re.sub(r'\s*uppercase\s*', ' ', cls)
                      cls = re.sub(r' {2,}', ' ', cls).strip()
                  return f'{prefix}{cls}{suffix}'
              text = re.sub(r'(className=\{`)([^`]*)(`\})', fix, text)
              text = re.sub(r'(className=")([^"]*)(")', fix, text)
              return text

          for rel in [
              "src/App.tsx",
              "src/components/DictionaryView.tsx",
              "src/components/FlashcardsView.tsx",
              "src/components/CommunityView.tsx",
              "src/components/CertificatesCleanView.tsx",
          ]:
              p = Path(rel)
              if not p.exists():
                  print("skip missing", rel)
                  continue
              orig = p.read_text()
              new = strip_upper(orig)
              if new != orig:
                  p.write_text(new)
                  print("sentence-case applied:", rel)
              else:
                  print("no title change:", rel)
          PY

      - name: Inject KaTeX math rules into Emi system prompt
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path("server.ts")
          t = p.read_text()
          if "Mathematical & Scientific Formatting" in t:
              print("Math rules already present")
          else:
              math_block = '''
6. Mathematical & Scientific Formatting (KaTeX) — STRICT, NON-NEGOTIABLE:
   When writing any equation, formula, matrix, fraction, root, integral, summation, or multi-step calculation, you MUST use KaTeX delimiters so the app renders them like Google Gemini.

   RULES:
   - Block / display math (equations, matrices, multi-line steps): wrap in double dollar signs on their own lines:
     $$
     \\\\begin{pmatrix} 3 & 4 \\\\\\\\ 5 & 6 \\\\end{pmatrix}
     $$
   - Inline math (variables inside a sentence): wrap in single dollar signs:
     "The determinant is $\\\\det(A) = ad - bc$."
   - NEVER output raw LaTeX (\\\\begin, \\\\frac, \\\\times, \\\\pmatrix, etc.) outside of $ or $$ delimiters.
   - NEVER wrap math in markdown code fences. Use pure $ / $$ only.
   - Inside matrices use double backslash `\\\\\\\\` for row breaks.
   - Prefer clean step-by-step headings and bullet points for non-math text.
   - Example:
     **Step 1 — Determinant**
     $$\\\\det(A) = (3 \\\\times 6) - (4 \\\\times 5) = -2$$
     **Step 2 — Inverse**
     $$A^{-1} = \\\\frac{1}{-2} \\\\begin{pmatrix} 6 & -4 \\\\\\\\ -5 & 3 \\\\end{pmatrix}$$

'''
              marker = "You can automatically render interactive plots/graphs and geometric shapes for the student using custom json-formatted code blocks (json:plot, json:geometry)."
              if marker in t:
                  t = t.replace(marker, marker + "\\n" + math_block)
                  p.write_text(t)
                  print("Inserted math rules after visualizations")
              else:
                  m = re.search(r'(function getEmiSystemInstruction[\s\S]*?return `)([\s\S]*?)(`;)', t)
                  if m:
                      body = m.group(2).rstrip() + "\\n" + math_block + "\\n"
                      t = t[:m.start()] + m.group(1) + body + m.group(3) + t[m.end():]
                      p.write_text(t)
                      print("Appended math rules to system instruction")
                  else:
                      print("ERROR: could not find insertion point")
                      raise SystemExit(1)
          assert "Mathematical & Scientific Formatting" in p.read_text()
          PY

      - name: Add prepareMathMarkdown client safety net in App.tsx
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path("src/App.tsx")
          t = p.read_text()
          helper = '''
/** Auto-wrap bare LaTeX so KaTeX/remark-math can render it (Gemini-quality math). */
function prepareMathMarkdown(text: string): string {
  if (!text || typeof text !== "string") return text;
  let s = text;
  s = s.replace(
    /(?<!\$)(\\begin\\{(pmatrix|bmatrix|matrix|aligned|align|cases|array|vmatrix|Vmatrix)\\}[\\s\\S]*?\\end\\{\\2\\})(?!\$)/g,
    "\\n$$$$\\n$1\\n$$$$\\n"
  );
  return s;
}

'''
          if "function prepareMathMarkdown" not in t:
              for mk in ["export default function App", "function App(", "const App ="]:
                  if mk in t:
                      t = t.replace(mk, helper + mk, 1)
                      print("Inserted helper before", mk)
                      break
          if "prepareMathMarkdown(msg.text)" not in t:
              t = t.replace(
                  "{msg.text}\n                </ReactMarkdown>",
                  "{prepareMathMarkdown(msg.text)}\n                </ReactMarkdown>",
              )
              t = t.replace(
                  "{msg.text}</ReactMarkdown>",
                  "{prepareMathMarkdown(msg.text)}</ReactMarkdown>",
              )
              print("Wired prepareMathMarkdown into ReactMarkdown")
          p.write_text(t)
          assert "function prepareMathMarkdown" in p.read_text()
          print("App.tsx math safety net OK")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "fix: KaTeX math for Emi (Gemini-quality), sentence-case titles, restore Dictionary"
            git push origin HEAD:main
          fi

      - name: Self-delete this one-shot workflow
        run: |
          rm -f .github/workflows/fix-math-titles.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove one-shot fix-math-titles workflow" || true
          git push origin HEAD:main || true
