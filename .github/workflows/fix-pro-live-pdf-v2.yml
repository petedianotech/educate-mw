name: Fix Pro Live PDF v2
on:
  push:
    paths:
      - "scripts/fix_pro_live_pdf_v2.py"
      - ".github/workflows/fix-pro-live-pdf-v2.yml"
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_pro_live_pdf_v2.py
      - run: |
          git config user.name "Peter Damiano"
          git config user.email "petedianotech@gmail.com"
          git add src/App.tsx src/services/geminiLive.ts || true
          git commit -m "fix: Pro blue theme, Live languageCode en-US, Library PDF modal" || echo none
          git push origin HEAD:main
