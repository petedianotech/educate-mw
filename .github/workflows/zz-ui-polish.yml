name: UI polish Pro Videos MSCE
on:
  push:
    paths:
      - ".github/workflows/zz-ui-polish.yml"
  workflow_dispatch:

jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Polish App.tsx Pro + Videos titles
        run: |
          python3 << 'ENDPY'
          from pathlib import Path
          import re

          p = Path("src/App.tsx")
          t = p.read_text()

          # 1) Video Lessons title -> sentence case (no ALL CAPS feel)
          t = t.replace(
              "Video Lessons & Tutorials",
              "Video lessons & tutorials",
          )
          # Remove uppercase from any remaining text-2xl/text-lg headers near Videos
          def strip_upper(text):
              def fix(m):
                  prefix, cls, suffix = m.group(1), m.group(2), m.group(3)
                  if re.search(r"text-(?:lg|xl|2xl)", cls) and "uppercase" in cls:
                      cls = re.sub(r"\s*uppercase\s*", " ", cls)
                      cls = re.sub(r" {2,}", " ", cls).strip()
                  return prefix + cls + suffix
              text = re.sub(r"(className=\{`)([^`]*)(`\})", fix, text)
              text = re.sub(r'(className=")([^"]*)(")', fix, text)
              return text
          t = strip_upper(t)

          # 2) Pro subscription bottom: softer indigo theme, sentence-case labels
          # WhatsApp button - keep green (brand) but drop shouty UPPERCASE
          old_wa = '''className="w-full py-4 px-6 bg-[#25D366] hover:bg-[#20bd5a] text-white font-black uppercase tracking-wider text-xs sm:text-sm rounded-2xl shadow-lg shadow-[#25D366]/20 transition-all active:scale-95 flex items-center justify-center gap-3 cursor-pointer"'''
          new_wa = '''className="w-full py-4 px-6 bg-[#25D366] hover:bg-[#20bd5a] text-white font-bold tracking-tight text-sm rounded-2xl shadow-lg shadow-[#25D366]/25 transition-all active:scale-[0.98] flex items-center justify-center gap-3 cursor-pointer"'''
          if old_wa in t:
              t = t.replace(old_wa, new_wa)
              print("Pro WhatsApp button polished")

          # Free tier card - indigo accent, sentence case
          t = t.replace(
              "Free Tier Status & Daily Limits",
              "Free tier status & daily limits",
          )
          t = t.replace(
              '''className={`text-xs font-bold uppercase tracking-wider ${theme === "dark" ? "text-slate-300" : "text-slate-700"}`}>
              Free tier status & daily limits''',
              '''className={`text-xs font-bold tracking-tight ${theme === "dark" ? "text-slate-200" : "text-slate-800"}`}>
              Free tier status & daily limits''',
          )

          # Verification helper text - less shouty
          t = t.replace(
              '''className="text-center text-[10px] font-bold text-slate-400 uppercase tracking-wider"
          >
            Verification is completed promptly upon receiving your payment reference.''',
              '''className="text-center text-[11px] font-medium text-slate-400 leading-relaxed"
          >
            Verification is completed promptly once Mr. Lifa receives your payment reference.''',
          )

          # Free tier box: indigo border accent to match app
          old_ft = '''className={`${theme === "dark" ? "bg-slate-900 border-slate-800" : "bg-slate-100/80 border-slate-200"} rounded-2xl p-4 border`}'''
          new_ft = '''className={`${theme === "dark" ? "bg-indigo-950/40 border-indigo-500/20" : "bg-indigo-50/80 border-indigo-200"} rounded-2xl p-4 border`}'''
          if old_ft in t:
              t = t.replace(old_ft, new_ft, 1)
              print("Free tier card indigo theme")

          p.write_text(t)
          print("App.tsx Pro + Videos polished")
          ENDPY

      - name: Polish MSCE Points Calculator UX
        run: |
          python3 << 'ENDPY'
          from pathlib import Path
          import re
          p = Path("src/components/MscePointsCalculatorView.tsx")
          if not p.exists():
              print("MSCE file missing"); raise SystemExit(0)
          t = p.read_text()

          # Sentence-case tab labels that use uppercase
          def strip_upper(text):
              def fix(m):
                  prefix, cls, suffix = m.group(1), m.group(2), m.group(3)
                  # Keep tiny labels, strip from larger interactive tabs with uppercase tracking-wider
                  if "uppercase" in cls and ("tracking-wider" in cls or "tracking-widest" in cls):
                      if "text-[9px]" in cls or "text-[10px]" in cls:
                          return m.group(0)  # keep micro labels
                      cls = re.sub(r"\s*uppercase\s*", " ", cls)
                      cls = re.sub(r" {2,}", " ", cls).strip()
                  return prefix + cls + suffix
              text = re.sub(r"(className=\{`)([^`]*)(`\})", fix, text)
              text = re.sub(r"(className=')([^']*)(')", fix, text)
              text = re.sub(r'(className=")([^"]*)(")', fix, text)
              return text

          orig = t
          t = strip_upper(t)

          # Friendlier empty-state / helper copy if present
          replacements = [
              ("Enter your MSCE grades below", "Enter your MSCE grades below"),
              ("Best 6 Aggregate", "Best 6 aggregate"),
              ("University Degree Matches", "University degree matches"),
              ("All Courses", "All courses"),
              ("Example Presets:", "Example presets"),
          ]
          for a, b in replacements:
              t = t.replace(a, b)

          # Soften Calculate / Universities tab uppercase look
          t = t.replace(
              "font-bold uppercase tracking-wider transition-all shrink-0 flex items-center gap-2",
              "font-bold tracking-tight transition-all shrink-0 flex items-center gap-2",
          )

          if t != orig:
              p.write_text(t)
              print("MSCE calculator UX polished")
          else:
              print("MSCE: minor or no text changes")
          ENDPY

      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "ui: Pro indigo bottom, video sentence-case, MSCE calculator friendlier UX"
            git push origin HEAD:main
          fi
          rm -f .github/workflows/zz-ui-polish.yml
          git add -A
          git commit -m "chore: remove one-shot ui polish workflow" || true
          git push origin HEAD:main || true
