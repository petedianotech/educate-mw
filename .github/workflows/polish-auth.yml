name: Polish Auth UI
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/polish-auth.yml"
jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply visual polish
        run: |
          python3 << 'PY'
          from pathlib import Path
          text = Path("src/App.tsx").read_text()
          pairs = [
            ('bg-gray-950 text-gray-100" : "bg-slate-50 text-slate-900"} p-4 sm:p-8 pt-10 sm:pt-14',
             'emw-page-bg-dark text-gray-100" : "emw-page-bg text-slate-900"} p-4 sm:p-6 lg:p-8 pt-8 sm:pt-12'),
            ('w-20 h-20 sm:w-24 sm:h-24 rounded-[24px] flex items-center justify-center shadow-xl shadow-indigo-600/20 mb-4 overflow-hidden p-1 bg-gradient-to-br from-indigo-600 to-blue-700 border border-indigo-400/30',
             'w-[72px] h-[72px] sm:w-20 sm:h-20 rounded-[22px] flex items-center justify-center shadow-lg shadow-indigo-600/25 mb-5 overflow-hidden p-[3px] bg-gradient-to-br from-indigo-500 to-indigo-700 border border-indigo-400/20'),
            ('bg-gray-900/80 border-gray-800" : "bg-white border-slate-200"} rounded-3xl p-6 sm:p-8 border shadow-sm space-y-6',
             'bg-gray-900/90 border-gray-800" : "bg-white border-slate-200/80"} rounded-3xl p-5 sm:p-7 border emw-card space-y-5'),
            ('bg-gray-900 border-gray-800 shadow-2xl" : "bg-white border-slate-200 shadow-xl"} rounded-3xl p-6 sm:p-8 border w-full',
             'bg-gray-900 border-gray-800" : "bg-white border-slate-200/80"} rounded-3xl p-5 sm:p-7 border w-full emw-card-elevated'),
            ('w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-600/20 active:scale-95 transition-all mt-2 flex items-center justify-center gap-3 disabled:opacity-50 text-sm',
             'w-full emw-btn-primary text-white font-bold py-3.5 rounded-xl active:scale-95 transition-all mt-2 flex items-center justify-center gap-3 disabled:opacity-50 text-sm'),
            ('fixed inset-0 bg-black/60 backdrop-blur-sm z-[150]',
             'fixed inset-0 emw-overlay z-[150]'),
          ]
          n = 0
          for o, r in pairs:
              if o in text:
                  text = text.replace(o, r, 1)
                  n += 1
                  print('ok', n)
              else:
                  print('miss')
          Path("src/App.tsx").write_text(text)
          print('total', n)
          PY
          git config user.name "Peter Damiano"
          git config user.email "petedianotech@gmail.com"
          git add src/App.tsx
          git commit -m "UI: Phase 1+2 Auth landing + PWA visual polish" || echo none
          git push origin HEAD:main
