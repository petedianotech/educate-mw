name: Community UI Polish
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/community_ui_polish.py"
      - ".github/workflows/community-ui-polish.yml"
jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/community_ui_polish.py
      - run: |
          git config user.name "Peter Damiano"
          git config user.email "petedianotech@gmail.com"
          git add src/components/CommunityView.tsx
          git commit -m "UI: community hierarchy, chips, composer, feed polish" || echo none
          git push origin HEAD:main
