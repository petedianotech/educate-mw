name: Cleanup workflows once
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cleanup-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Keep only android-apk.yml, version bump, sentence-case titles
        run: |
          set -e
          for f in .github/workflows/*.yml; do
            base=$(basename "$f")
            if [ "$base" != "android-apk.yml" ] && [ "$base" != "cleanup-once.yml" ]; then
              rm -f "$f"
              echo "removed $base"
            fi
          done

          git show 02f056cd60624120e94d80e79461d05239369f47:.github/workflows/android-apk.yml > .github/workflows/android-apk.yml

          python3 <<'PY2'
          from pathlib import Path
          import re

          p = Path(".github/workflows/android-apk.yml")
          text = p.read_text()
          if "Bump APK version" not in text:
              bump = """
      - name: Bump APK version (every build)
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -e
          VERSION_CODE=$((100 + RUN_NUMBER))
          VERSION_NAME="3.5.${RUN_NUMBER}"
          echo "APK versionCode=$VERSION_CODE versionName=$VERSION_NAME"
          BG=android/app/build.gradle
          test -f "$BG"
          if grep -q versionCode "$BG"; then
            sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode $VERSION_CODE/" "$BG"
          else
            sed -i "/defaultConfig {/a\\        versionCode $VERSION_CODE" "$BG"
          fi
          if grep -q versionName "$BG"; then
            sed -i -E "s/versionName[[:space:]]+\"[^\"]*\"/versionName \"$VERSION_NAME\"/" "$BG"
          else
            sed -i "/versionCode $VERSION_CODE/a\\        versionName \"$VERSION_NAME\"" "$BG"
          fi
          grep -E "versionCode|versionName" "$BG" || true
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

"""
              needle = "      - name: Install google-services.json"
              if needle not in text:
                  raise SystemExit("needle missing")
              text = text.replace(needle, bump + needle, 1)
              p.write_text(text)
              print("version bump injected")
          else:
              print("version bump already present")

          def fix_line(line: str) -> str:
              if "uppercase" not in line:
                  return line
              is_page = any(x in line for x in (
                  "text-lg", "text-xl", "text-2xl",
                  "text-base sm:text-lg", "text-sm md:text-lg", "text-xl md:text",
              ))
              if "border-amber-600" in line and "tracking-[0.25em]" in line:
                  return line
              if not is_page:
                  return line
              line2 = re.sub(r"\buppercase\b\s*", "", line)
              if any(x in line2 for x in ("text-lg", "text-xl", "text-2xl")):
                  line2 = line2.replace("font-black", "font-bold")
              line2 = re.sub(r"  +", " ", line2)
              return line2

          for path in Path("src").rglob("*.tsx"):
              lines = path.read_text().splitlines(keepends=True)
              new = [fix_line(l) for l in lines]
              if new != lines:
                  path.write_text("".join(new))
                  print("titles:", path)
          PY2

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm -f .github/workflows/cleanup-once.yml || true
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: only APK workflow remains; auto version bump; sentence-case page titles"
            git push origin HEAD:main
          fi
