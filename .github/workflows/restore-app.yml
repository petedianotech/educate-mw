name: Restore App.tsx
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-app.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore App.tsx from known-good commit
        run: |
          set -e
          GOOD_SHA=9e212d5
          echo "Restoring src/App.tsx from $GOOD_SHA"
          git show "$GOOD_SHA:src/App.tsx" > src/App.tsx
          wc -c src/App.tsx
          head -5 src/App.tsx
          if grep -q PLACEHOLDER src/App.tsx; then
            echo "ERROR: still placeholder"
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("package.json")
          d = json.loads(p.read_text())
          d["scripts"]["build"] = "vite build && esbuild server.ts --bundle --platform=node --format=cjs --packages=external --sourcemap --outfile=dist/server.cjs"
          p.write_text(json.dumps(d, indent=2) + "\n")
          print("package.json build reset to normal")
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx package.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "fix: restore src/App.tsx from 9e212d5 (AuthView JSX + remove PLACEHOLDER)"
            git push origin HEAD:main
            echo "Pushed restore commit"
          fi
