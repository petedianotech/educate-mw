name: Polish Pro Live PDF
on:
  push:
    paths:
      - "scripts/polish_pro_live_pdf.py"
      - "src/components/PdfViewerModal.tsx"
      - ".github/workflows/polish-pro-live-pdf.yml"
  workflow_dispatch:
jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/polish_pro_live_pdf.py
      - run: |
          git config user.name "Peter Damiano"
          git config user.email "petedianotech@gmail.com"
          git add src/App.tsx src/services/geminiLive.ts src/components/PdfViewerModal.tsx || true
          git commit -m "ui: Pro blue theme, Live en-US subtitles, in-app PDF reader" || echo none
          git push origin HEAD:main
