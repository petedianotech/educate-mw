name: Restore CommunityView to main
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-communityview.yml"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch known-good CommunityView
        run: |
          mkdir -p src/components
          curl -fsSL "https://raw.githubusercontent.com/petedianotech/educate-mw/25831e2/src/components/CommunityView.tsx" -o src/components/CommunityView.tsx
          grep -q "export function CommunityView" src/components/CommunityView.tsx
          wc -c src/components/CommunityView.tsx
      - run: |
          git config user.name "Peter Damiano"
          git config user.email "petedianotech@gmail.com"
          git add src/components/CommunityView.tsx
          git commit -m "fix: restore CommunityView.tsx export (vite build)" || echo none
          git push origin HEAD:main
