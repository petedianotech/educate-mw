name: Build Release APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "android-config/**"
      - "capacitor.config.ts"
      - "package.json"
      - "vite.config.*"
      - "index.html"
      - ".github/workflows/android-apk.yml"

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Require Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            eval "val=\$$v"
            if [ -z "$val" ]; then echo "::error::Missing secret $v"; exit 1; fi
          done
          echo "Signing secrets OK"

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/browser
          npm install @capgo/capacitor-social-login @capacitor-community/file-opener @capgo/capacitor-file-picker || true

      - name: Vite build (web assets for Capacitor)
        run: npx vite build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}

      - name: Capacitor Android + permissions
        run: |
          if [ ! -f capacitor.config.ts ]; then
            cat > capacitor.config.ts << 'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'mw.educate.app',
            appName: 'Educate MW',
            webDir: 'dist',
            server: { androidScheme: 'https' },
            android: { allowMixedContent: false, backgroundColor: '#0b1120' },
          };
          export default config;
          EOF
          fi
          test -d dist || { echo "dist missing after vite build"; ls -la; exit 1; }
          npx cap add android || true
          npx cap sync android
          test -f android/gradlew || { echo "gradlew missing"; exit 1; }
          chmod +x android/gradlew

          # Microphone + network for Emi Live + HTTPS
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            for perm in RECORD_AUDIO MODIFY_AUDIO_SETTINGS INTERNET ACCESS_NETWORK_STATE; do
              if ! grep -q "android.permission.$perm" "$MANIFEST"; then
                sed -i "s|<application|<uses-permission android:name=\"android.permission.$perm\" />\n    <application|" "$MANIFEST"
              fi
            done
            echo "Permissions in manifest:"
            grep uses-permission "$MANIFEST" || true
          fi

      - name: Install google-services.json (inject API key from secret)
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: |
          mkdir -p android/app
          # Prefer full JSON from secret if provided; else template + key inject
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json
          else
            cp android-config/google-services.json android/app/google-services.json
            KEY="${VITE_FIREBASE_API_KEY:-AIzaSyBWRpqj-uAqH0UGhGKvIiB3spOyc5OAS0U}"
            sed -i "s|\\[FIREBASE_ANDROID_API_KEY\]|${KEY}|g" android/app/google-services.json || true
            sed -i "s|\\$\{FIREBASE_ANDROID_API_KEY\}|${KEY}|g" android/app/google-services.json || true
          fi
          test -s android/app/google-services.json
          # Avoid committing keys: ensure placeholder not left if sed failed
          grep -q 'api_key' android/app/google-services.json

          if [ -f android/build.gradle ] && ! grep -q "google-services" android/build.gradle; then
            sed -i "s/dependencies {/dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'/" android/build.gradle || true
          fi
          if [ -f android/app/build.gradle ] && ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          test -s "$GITHUB_WORKSPACE/release.keystore"

      - name: Assemble RELEASE signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Upload EducateMW-release.apk
        run: |
          mkdir -p artifacts-apk
          find android/app/build/outputs/apk/release -name "*.apk" -exec cp -v {} artifacts-apk/ \;
          test "$(ls -A artifacts-apk)" || { echo "No release APK"; exit 1; }
          f=$(ls artifacts-apk/*.apk | head -1)
          mv "$f" artifacts-apk/EducateMW-release.apk
          ls -lah artifacts-apk

      - uses: actions/upload-artifact@v4
        with:
          name: EducateMW-release-apk
          path: artifacts-apk/EducateMW-release.apk
          if-no-files-found: error
          retention-days: 30
