name: Build Release APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "scripts/**"
      - ".github/workflows/community*.yml"
      - ".github/workflows/patch-*.yml"
      - ".github/workflows/polish-*.yml"
      - ".github/workflows/restore-*.yml"
      - ".github/workflows/run-*.yml"
      - ".github/workflows/phase3*.yml"

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Require Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          [ -z "$ANDROID_KEYSTORE_BASE64" ] && echo "MISSING ANDROID_KEYSTORE_BASE64" && missing=1
          [ -z "$ANDROID_KEYSTORE_PASSWORD" ] && echo "MISSING ANDROID_KEYSTORE_PASSWORD" && missing=1
          [ -z "$ANDROID_KEY_ALIAS" ] && echo "MISSING ANDROID_KEY_ALIAS" && missing=1
          [ -z "$ANDROID_KEY_PASSWORD" ] && echo "MISSING ANDROID_KEY_PASSWORD" && missing=1
          if [ "$missing" = "1" ]; then
            echo "::error::Add all 4 Android signing secrets, then re-run Build Release APK."
            exit 1
          fi
          echo "Signing secrets OK"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm install -D @capacitor/cli@latest @capacitor/core@latest @capacitor/android@latest
          npm install @capacitor/app @capacitor/browser @capgo/capacitor-social-login @capacitor-community/file-opener @capgo/capacitor-file-picker || true

      - name: Build web
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}

      - name: Capacitor Android platform
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            cat > capacitor.config.ts << 'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'mw.educate.app',
            appName: 'Educate MW',
            webDir: 'dist',
            server: { androidScheme: 'https' },
            android: { allowMixedContent: false, backgroundColor: '#0b1120' },
          };
          export default config;
          EOF
          fi
          test -d dist || { echo "dist missing"; exit 1; }
          npx cap add android || true
          npx cap sync android
          test -f android/gradlew || { echo "gradlew missing"; exit 1; }
          chmod +x android/gradlew

      - name: Decode keystore + print fingerprints
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          test -s "$GITHUB_WORKSPACE/release.keystore" || exit 1
          keytool -list -v -keystore "$GITHUB_WORKSPACE/release.keystore" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" 2>/dev/null | grep -E "SHA1:|SHA256:" || true

      - name: Assemble RELEASE signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Collect EducateMW-release.apk
        run: |
          mkdir -p artifacts-apk
          find android/app/build/outputs/apk/release -name "*.apk" -exec cp -v {} artifacts-apk/ \;
          test "$(ls -A artifacts-apk)" || { echo "No release APK"; exit 1; }
          f=$(ls artifacts-apk/*.apk | head -1)
          mv "$f" artifacts-apk/EducateMW-release.apk
          ls -lah artifacts-apk

      - name: Upload EducateMW-release.apk
        uses: actions/upload-artifact@v4
        with:
          name: EducateMW-release-apk
          path: artifacts-apk/EducateMW-release.apk
          if-no-files-found: error
          retention-days: 30
