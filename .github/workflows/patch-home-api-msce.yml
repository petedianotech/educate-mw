name: Patch home API MSCE
on:
  push:
    paths:
      - "scripts/patch_home_api_msce.py"
      - "src/lib/api.ts"
      - ".github/workflows/patch-home-api-msce.yml"
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_home_api_msce.py
      - run: |
          git config user.name "Peter Damiano"
          git config user.email "petedianotech@gmail.com"
          git add src/App.tsx src/services/geminiLive.ts src/components/MscePointsCalculatorView.tsx src/lib/api.ts || true
          git commit -m "ui: blue home icons, apiUrl for APK Gemini, simpler MSCE calculator" || echo none
          git push origin HEAD:main
