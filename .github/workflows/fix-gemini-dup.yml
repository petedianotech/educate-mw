name: Force fix geminiLive
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-gemini-dup.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deduplicate transcription keys
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          p = Path("src/services/geminiLive.ts")
          lines = p.read_text().splitlines(keepends=True)
          out = []
          seen_in_config = {"input": 0, "output": 0}
          in_config_block = False
          for i, line in enumerate(lines):
              stripped = line.strip()
              # Detect config object for live.connect
              if "config: {" in line and i > 0 and "live.connect" in "".join(lines[max(0,i-15):i]):
                  in_config_block = True
                  seen_in_config = {"input": 0, "output": 0}
              if in_config_block and stripped.startswith("callbacks:"):
                  in_config_block = False
              if in_config_block:
                  if "inputAudioTranscription:" in stripped:
                      seen_in_config["input"] += 1
                      if seen_in_config["input"] > 1:
                          print(f"drop duplicate input at line {i+1}")
                          continue
                  if "outputAudioTranscription:" in stripped:
                      seen_in_config["output"] += 1
                      if seen_in_config["output"] > 1:
                          print(f"drop duplicate output at line {i+1}")
                          continue
              out.append(line)
          p.write_text("".join(out))
          text = p.read_text()
          print("input count", text.count("inputAudioTranscription: {}"))
          print("output count", text.count("outputAudioTranscription: {}"))
          assert text.count("inputAudioTranscription: {}") == 1
          assert text.count("outputAudioTranscription: {}") == 1
          print("OK")
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/services/geminiLive.ts
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "fix: dedupe Live input/outputAudioTranscription (Vite esbuild)"
            git push origin HEAD:main
          fi
