name: Fix Pro Live PDF v3
on:
  push:
    paths:
      - "scripts/fix_pro_live_pdf_v3.py"
      - ".github/workflows/fix-pro-live-pdf-v3.yml"
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_pro_live_pdf_v3.py
      - name: Commit
        run: |
          git config user.name "Peter Damiano"
          git config user.email "petedianotech@gmail.com"
          git add src/App.tsx src/services/geminiLive.ts
          git status
          git commit -m "fix: Pro blue theme, Live en-US, in-app PDF viewer wired" || echo none
          git push origin HEAD:main
