name: Fix Library JSX 2
on:
  push:
    paths:
      - "scripts/fix_library_jsx2.py"
      - ".github/workflows/fix-library-jsx2.yml"
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_library_jsx2.py
      - run: |
          git config user.name "Peter Damiano"
          git config user.email "petedianotech@gmail.com"
          git add src/App.tsx
          git commit -m "fix: PdfViewerModal correctly inside LibraryView" || echo none
          git push origin HEAD:main
      - name: Quick vite syntax check
        run: |
          npm install --ignore-scripts 2>/dev/null || npm install
          npx vite build 2>&1 | tail -40
